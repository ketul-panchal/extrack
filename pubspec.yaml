name: spent
description: "Spent: a private, offline-first expense tracker"
publish_to: 'none'
version: 1.0.1+6

environment:
  sdk: ^3.12.1
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.2.0

  # State, navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

  # Local storage (everything stays on the device)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6

  # Device features
  local_auth: ^3.0.2
  file_picker: ^13.1.0
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1

  # Utilities
  clock: ^1.1.2
  collection: ^1.19.1
  crypto: ^3.0.7
  intl: ^0.20.2
  posthog_flutter: ^5.52.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
  assets:
    - assets/fonts/manrope/OFL.txt
