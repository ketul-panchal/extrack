# Generated from assets/icon/*.png, which are rendered from the in-app logo
# painter (lib/shared/widgets/brand_logo.dart):
#   RENDER_ICONS=1 flutter test test/tool/render_icons_test.dart
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#16181C"
  image_path_ios_dark_transparent: "assets/icon/ios_dark.png"
  image_path_ios_tinted_grayscale: "assets/icon/ios_tinted.png"
  desaturate_tinted_to_grayscale_ios: true
